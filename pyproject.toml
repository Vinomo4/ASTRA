[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "astra"
version = "1.0.0"
description = "ASTRA: Algorithmic Stress Testing & Robustness Analytics"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12, <3.13"
authors = [{ name = "Victor Novelle" }]
dependencies = [
  "polars>=0.20.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "pyyaml>=6.0.1",
  "duckdb>=0.10.0",
  "yfinance>=0.2.36",
  "ccxt>=4.2.0",
  "pandas-ta>=0.3.14b0",
  "scikit-learn>=1.4.0",
  "xgboost>=2.0.3",
  "optuna>=3.5.0",
  "joblib>=1.3.0",
  "mlflow>=2.10.0",
  "quantstats>=0.0.62",
  "plotly>=5.18.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "websockets>=12.0",
  "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.2.1",
  "mypy>=1.8.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]